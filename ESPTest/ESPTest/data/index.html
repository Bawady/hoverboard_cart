<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="raphael.min.js" defer></script>
  <script src="justgage.min.js" defer></script>
  <title>Cockpit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }

    .top-bar {
      background-color: #333;
      color: white;

      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .top-bar h2 {
      margin: 0;
      text-align: center;
      flex-grow: 1;;
    }

    .menu-button {
      font-size: 1.5rem;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -220px;
      width: 200px;
      height: 100%;
      background-color: #444;
      color: white;
      padding-top: 60px;
      transition: right 0.3s ease;
      z-index: 1000;
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar button {
      display: block;
      width: 100%;
      padding: 12px;
      background: none;
      border: none;
      color: white;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
    }

    .container {
      padding: 20px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .gauges {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    fieldset label {
      margin-right: 10px;
    }

    .network-list button {
      display: block;
      margin: 5px auto;
      padding: 10px;
      width: 90%;
      background-color: #e0e0e0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .network-list button.selected {
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
    }

    @media screen and (max-width: 600px) and (orientation: landscape) {
      .gauges div {
        width: 45%;
        height: 140px;
      }
      .sidebar {
        width: 160px;
      }
    }
    .loading-text .dots::after {
    content: '';
    display: inline-block;
    animation: dots 1s steps(3, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }

  </style>

</head>
<body>
  <div class="top-bar">
    <h2>Bierkisten-Wagerl Cockpit</h2>
    <button class="menu-button" onclick="toggleSidebar()">☰</button>
  </div>

  <div class="sidebar" id="sidebar">
    <button onclick="showSection('cockpit')">Cockpit</button>
    <button onclick="showSection('configuration')">Configuration</button>
    <button onclick="showSection('connectivity')">Connectivity</button>
  </div>

  <div class="container">
    <div id="cockpit" class="section active">
      <div class="gauges" id="tachoGauges">
        <div id="gaugeRpm" style="width:250px; height:160px;"></div>
        <div id="gaugeSpeed" style="width:250px; height:160px;"></div>
      </div>

      <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; font-size: 12px; color: #555;">
        <div style="background: #f9f9f9; border-radius: 5px; padding: 6px 10px; min-width: 90px;">
          <div><strong style="font-size: 11px;">Board Temperature</strong></div>
          Front: <span id="temp0">--</span>°C<br>
          Rear: <span id="temp1">--</span>°C
        </div>
        <div style="background: #f9f9f9; border-radius: 5px; padding: 6px 10px; min-width: 90px;">
          <div><strong style="font-size: 11px;">Battery Voltage</strong></div>
          Front: <span id="volt0">--</span>V<br>
          Rear: <span id="volt1">--</span>V
        </div>
      </div>

    </div>

    <div id="configuration" class="section", style="text-align:center">
      <h3>Click the axes to toggle them!</h3>
      <div id="svgContainer">
        <svg id="carSvg" width="200" height="400" viewBox="0 0 100 200" style="margin: 10px auto; display: block;">
          <rect x="20" y="20" width="60" height="100" rx="2" ry="2" fill="#ccc" />

          <line id="frontAxle" x1="10" y1="30" x2="90" y2="30" stroke="#00aaff" stroke-width="8" cursor="pointer" />
          <rect id="frontLeft" x="5" y="18" width="10" height="24" rx="2" ry="5" fill="#00aaff" />
          <rect id="frontRight" x="85" y="18" width="10" height="24" rx="2" ry="5" fill="#00aaff" />

          <rect id="babyMode" x="45" y="60" width="10" height="10" rx="2" ry="2" fill="#00aaff" cursor="pointer"/>

          <line id="rearAxle" x1="10" y1="110" x2="90" y2="110" stroke="#00aaff" stroke-width="8" cursor="pointer" />
          <rect id="rearLeft" x="5" y="98" width="10" height="24" rx="2" ry="5" fill="#00aaff" />
          <rect id="rearRight" x="85" y="98" width="10" height="24" rx="2" ry="5" fill="#00aaff" />
        </svg>
      </div>

      <input type="hidden" name="driveMode" id="driveModeInput" value="2">
    </div>

<div id="connectivity" class="section">
  <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
    <button onclick="toggleWifiConfig()">Refresh</button>
    <button id="ssidBtn" onclick="enterSsidManually()">Enter SSID</button>
  </div>

  <div id="wifiConfig" style="display: none;">
    <p id="loadingText">Loading networks...</p>
    <div id="networkList" class="network-list"></div>

    <form id="ssidForm" style="display: flex; flex-direction: column; gap: 10px; padding: 15px; background-color: #f9f9f9; border-radius: 8px; width: 300px; margin: 10px auto; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
      <input type="hidden" name="ssid" id="selectedSSID">

      <label for="password" style="font-size: 14px; font-weight: bold; color: #333;">Password:</label>
      <input type="password" id="password" name="password" style="padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box;">

      <div id="manualSsidForm" style="display: none;">
        <label for="manualSsid">Manual SSID:</label>
        <input type="text" id="manualSsid" name="ssid" style="padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; width: 100%; box-sizing: border-box;">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <input value="Save WiFi" onclick="saveWifi()" style="padding: 8px 15px; font-size: 14px; background-color: #00aaff; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;">

        <button onclick="clearForm()" style="padding: 8px 15px; font-size: 14px; background-color: #ccc; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.3s;">
          Clear
        </button>
      </div>
    </div>
  </div>

  <div id="manualSsidToggle" style="display: block;">
    <div id="networkList"></div>
  </div>
</div>

<script>
  let gauges;
  let manual=false;
  let babyModeActive=false;
  let driveMode=2;
  let frontAxle, frontLeft, frontRight, rearAxle, rearLeft, rearRight, driveInput, babyMode;

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('active');
  }

  function showSection(id) {
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    toggleSidebar();
    if (id == "connectivity") {
      toggleWifiConfig();
    }
  }

  function rpm_to_kmh(rpm) {
    return rpm * 0.547 * 60 / 1000;
  }

  function toggleBabyMode() {
    setBabyMode(!babyModeActive);
    updateControlOptions();
  }

  function updateDriveMode(mode) {
    const currentMode = parseInt(driveInput.value);
    driveMode = currentMode;

    if (currentMode == 2 && mode == 0) {
      driveMode = 1;
    } else if (currentMode == 2 && mode === 1) {
      driveMode = 0;
    } else if ((currentMode == 1 && mode == 0) || (currentMode == 0 && mode == 1)) {
      driveMode = 2;
    }
    updateControlOptions();
  }

  function setBabyMode(mode) {
    babyModeActive = mode;
    if (mode) {
      babyMode.setAttribute("fill", "#00aaff");
    }
    else{
      babyMode.setAttribute("fill", "#888");
    }
  }

  function setDriveMode(mode) {

    frontAxle.setAttribute("stroke", "#888");
    frontLeft.setAttribute("fill", "#888");
    frontRight.setAttribute("fill", "#888");
    rearAxle.setAttribute("stroke", "#888");
    rearLeft.setAttribute("fill", "#888");
    rearRight.setAttribute("fill", "#888");

    if (mode == 2) {
      frontAxle.setAttribute("stroke", "#00aaff");
      frontLeft.setAttribute("fill", "#00aaff");
      frontRight.setAttribute("fill", "#00aaff");
      rearAxle.setAttribute("stroke", "#00aaff");
      rearLeft.setAttribute("fill", "#00aaff");
      rearRight.setAttribute("fill", "#00aaff");
    } else if (mode == 1) {
      rearAxle.setAttribute("stroke", "#00aaff");
      rearLeft.setAttribute("fill", "#00aaff");
      rearRight.setAttribute("fill", "#00aaff");
    } else {
      frontAxle.setAttribute("stroke", "#00aaff");
      frontLeft.setAttribute("fill", "#00aaff");
      frontRight.setAttribute("fill", "#00aaff");
    }

    driveInput.value = mode;
  }

  window.addEventListener('DOMContentLoaded', () => {
    // DOM elements are only accessible once the page is fully loaded
    frontAxle = document.getElementById("frontAxle");
    frontLeft = document.getElementById("frontLeft");
    frontRight = document.getElementById("frontRight");
    rearAxle = document.getElementById("rearAxle");
    rearLeft = document.getElementById("rearLeft");
    rearRight = document.getElementById("rearRight");
    driveInput = document.getElementById("driveModeInput");
    babyMode = document.getElementById("babyMode");

    driveInput.value = "2"; // Default value for the drive mode

    // Set click events for interaction with elements
    frontAxle.onclick = () => updateDriveMode(0);
    rearAxle.onclick = () => updateDriveMode(1);
    babyMode.onclick = () => toggleBabyMode();
  });

  function fetchState() {
    fetch('/get_state')
      .then(res => res.json())
      .then(data => {
        let rpm = 0;
        let speed = 0;
        for (let i = 0; i < data.axes.length; i++) {
          const axisData = data.axes[i];
          rpml = Math.abs(Number(axisData.left_rpm));
          rpmr = Math.abs(Number(axisData.right_rpm));
          rpm_avg = (rpml + rpmr) / 2;
          rpm += rpm_avg;
          speed += rpm_to_kmh(rpm_avg);
          document.getElementById("temp" + i).textContent = axisData.temperature / 10;
          document.getElementById("volt" + i).textContent = axisData.voltage / 100;
        }
        gauges.rpm.refresh(rpm / data.axes.length);
        gauges.speed.refresh(speed / data.axes.length);

        const currentMode = parseInt(driveInput.value);
        setDriveMode(parseInt(data.drive_mode));
      })
      .catch(err => console.error('Failed to fetch state:', err));
  }

  function updateControlOptions() {
    fetch(`/set?drive=${driveMode}&baby=${babyModeActive}`).catch(err => console.error("Failed to update mode:", err));
  }

  function enterSsidManually() {
    const manualForm = document.getElementById("manualSsidForm");
    const networkList = document.getElementById("networkList");
    const ssidBtn = document.getElementById("ssidBtn");

    if (manualForm.style.display === "none") {
      manualForm.style.display = "block";
      networkList.style.display = "none";
      ssidBtn.innerText = "Visible Networks";
      manual = true;
    } else {
      manualForm.style.display = "none";
      networkList.style.display = "block";
      ssidBtn.innerText = "Enter SSID";
      manual = false;
      toggleWifiConfig();
    }
  }

  function clearForm() {
    document.getElementById("selectedSSID").value = "";
    document.getElementById("manualSsid").value = "";
    document.getElementById("password").value = "";
  }

  function toggleWifiConfig() {
    document.getElementById("wifiConfig").style.display = "block";
    document.getElementById("loadingText").style.display = "block";
    document.getElementById("networkList").innerHTML = "";

    fetch("/get_networks")
      .then(res => res.json())
      .then(data => {
        document.getElementById("loadingText").style.display = "none";
        const list = document.getElementById("networkList");
        data.forEach(net => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = `${net.ssid} (${net.rssi} dBm)`;
          btn.onclick = () => {
            document.querySelectorAll(".network-list button").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            document.getElementById("selectedSSID").value = net.ssid;
          };
          list.appendChild(btn);
        });
      })
      .catch(err => {
        document.getElementById("loadingText").textContent = "Failed to load networks.";
        console.error("Network fetch error:", err);
      });
  }

  function saveWifi() {
    const ssid = manual ? document.getElementById("manualSsid").value : document.getElementById("selectedSSID").value;
    const password = document.getElementById("password").value;

    if (!ssid || !password) {
      alert("Please enter SSID and password.");
      return;
    }

    const req = `/save_ap?ssid=${ssid}&password=${password}`
    fetch(req).catch(err => console.error("Failed to update WiFi:", err));
  }

  window.onload = function () {
    gauges = {
      rpm: new JustGage({ id: "gaugeRpm", value: 0, min: 0, max: 1000, label: "rpm" }),
      speed: new JustGage({ id: "gaugeSpeed", value: 0, min: 0, max: 25, label: "km/h" })
    };

    setInterval(fetchState, 500);
  };

</script>

</body>
</html>
